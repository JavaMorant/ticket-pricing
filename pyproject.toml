[project]
name = "ticket-pricing"
version = "0.1.0"
description = "Ticket pricing & demand model — Phase 0 ingest: raw platform exports to events / transactions / event_tier."
# readme: deliberately not declared yet — README.md is a Phase 6 deliverable (SPEC.md 7),
# the one with the numbers in it. Declaring it here would force an empty placeholder.
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "pyarrow>=17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing"]
